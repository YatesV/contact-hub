name: Build APK

on:
  push:
    branches: [main]
  # PRs get tested and built too, but don't replace the "latest" APK
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes: finish one release at a time
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ContactHub.apk
          # Same app under its new name. ContactHub.apk stays so older versions keep auto-updating.
          cp app/build/outputs/apk/release/app-release.apk Orbit.apk

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContactHub-apk
          path: |
            Orbit.apk
            ContactHub.apk

      # Fixed link you can open on your phone:
      # https://github.com/YatesV/contact-hub/releases/latest/download/Orbit.apk
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          echo "{\"build\": $BUILD, \"sha\": \"${{ github.sha }}\"}" > version.json
          TITLE="Orbit build #$BUILD"
          NOTES="Download **Orbit.apk** below and open it on your phone to install. Updates install over the old version and keep your data."
          if gh release view latest >/dev/null 2>&1; then
            # Replace the files in place (never delete the release, so update checks keep working mid-publish).
            # APKs first, version.json last, so phones only see the new build once its APK is there.
            gh release upload latest Orbit.apk ContactHub.apk --clobber
            gh release upload latest version.json --clobber
            gh release edit latest --title "$TITLE" --notes "$NOTES" --latest
            git tag -f latest "${{ github.sha }}"
            git push -f origin refs/tags/latest || true
          else
            gh release create latest Orbit.apk ContactHub.apk version.json \
              --target "${{ github.sha }}" --title "$TITLE" --notes "$NOTES" --latest
          fi
