name: Build APK

on:
  push:
    branches: [main]
  # PRs get tested and built too, but don't replace the "latest" APK
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ContactHub.apk
          # Same app under its new name. ContactHub.apk stays so older versions keep auto-updating.
          cp app/build/outputs/apk/release/app-release.apk Orbit.apk

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContactHub-apk
          path: |
            Orbit.apk
            ContactHub.apk

      # Fixed link you can open on your phone:
      # https://github.com/YatesV/contact-hub/releases/latest/download/Orbit.apk
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Orbit.apk ContactHub.apk \
            --target "${{ github.sha }}" \
            --title "Orbit build #${{ github.run_number }}" \
            --notes "Download **Orbit.apk** below and open it on your phone to install. Updates install over the old version and keep your data." \
            --latest
